name: publish

# Publishes on a v* tag with provenance, through npm trusted publishing (OIDC).
# This workflow will not succeed until the owner has made the first manual
# publish of 0.1.0 and then configured the trusted publisher for this
# repository and workflow file on npmjs.com.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm test
      - name: Assert the tag equals the package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          }
      - run: npm publish --provenance --access public
